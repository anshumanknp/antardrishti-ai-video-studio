<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/antardrishti-mark.svg" type="image/svg+xml">
  <title>Antardrishti Studio · Admin Login</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:#0d1421;color:#edf2f8}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 15% 5%,#1c2b40 0,transparent 38%),#0d1421}
    main{width:min(100%,420px);padding:28px;border:1px solid #2a3a50;border-radius:18px;background:#151f30;box-shadow:0 24px 80px #0006}
    .mark{width:58px;height:58px;display:grid;place-items:center;margin-bottom:20px}
    h1{margin:0 0 8px;font:500 29px Georgia,serif}
    p{color:#91a0b4;font-size:13px;line-height:1.6}
    label{display:block;margin:18px 0 7px;color:#c4cede;font-size:12px}
    input{width:100%;min-height:48px;padding:12px 13px;border:1px solid #34465e;border-radius:9px;background:#0f1928;color:#edf2f8;font:inherit;font-size:14px}
    input:focus{outline:2px solid #9c783f;outline-offset:1px}
    button{width:100%;min-height:48px;margin-top:22px;border:0;border-radius:9px;background:#d7ae69;color:#1b2432;font-weight:750;font-size:14px}
    button:disabled{opacity:.6}
    #error{min-height:20px;margin:14px 0 0;color:#e58e8e;font-size:12px}
    .foot{margin-top:20px;color:#75869c;font-size:11px;text-align:center}
  </style>
</head>
<body>
  <main>
    <div class="mark"><img src="/antardrishti-mark.svg" alt="Antardrishti" width="58" height="58"></div>
    <h1>Antardrishti Studio</h1>
    <p>अपने video workspace में sign in करें। यह dashboard केवल administrator के लिए है।</p>
    <form id="loginForm">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" value="administrator" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button id="submitButton" type="submit">Sign in</button>
      <p id="error" role="alert"></p>
    </form>
    <div class="foot">Private workspace · Protected by administrator login</div>
  </main>
  <script>
    const form = document.getElementById("loginForm");
    const button = document.getElementById("submitButton");
    const error = document.getElementById("error");
    fetch("/api/auth/me", { credentials: "same-origin" }).then(response => response.json()).then(result => {
      if (result.authenticated) location.replace("/");
    }).catch(() => {});
    form.addEventListener("submit", async event => {
      event.preventDefault();
      button.disabled = true;
      button.textContent = "Signing in…";
      error.textContent = "";
      try {
        const response = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify({
            username: document.getElementById("username").value,
            password: document.getElementById("password").value
          })
        });
        const result = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(result.error || "Sign in नहीं हो पाया।");
        location.replace("/");
      } catch (loginError) {
        error.textContent = loginError.message || "Sign in नहीं हो पाया।";
      } finally {
        button.disabled = false;
        button.textContent = "Sign in";
      }
    });
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("/service-worker.js").catch(() => {});
  </script>
</body>
</html>
