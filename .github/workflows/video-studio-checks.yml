name: Video Studio checks

on:
  push:
    branches: [main, "work/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  node-smoke-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Check server JavaScript syntax
        run: node --check src/server.js
      - name: Run job-store regression tests
        run: npm test
      - name: Verify package metadata
        run: node -e "const p=require('./package.json'); if (!p.scripts || !p.scripts.start) process.exit(1); console.log(p.name, p.version)"
